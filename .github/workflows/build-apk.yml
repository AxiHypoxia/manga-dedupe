name: build-apk

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    # 锁 22.04：自带 Android SDK，避开 ubuntu-latest 迁到 Ubuntu 26 的变动
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 准备
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls -d "$SDK"/platforms/* 2>/dev/null | head -5 || true
          export PATH="$PATH:$SDK/cmdline-tools/latest/bin:$SDK/cmdline-tools/bin:$SDK/tools/bin"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -20 || true
          else
            echo "sdkmanager 不在 PATH，依赖镜像自带组件"
          fi
          mkdir -p android
          printf 'sdk.dir=%s\n' "$SDK" > android/local.properties
          cat android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 单元测试（判定逻辑，纯 JVM）
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon 2>&1 | tee ../build-log-test.txt

      - name: 构建 Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon 2>&1 | tee ../build-log-apk.txt

      - name: 显示产物
        run: |
          ls -lh android/app/build/outputs/apk/debug/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            android/app/build/outputs/apk/debug/*.apk
            build-log-*.txt
          if-no-files-found: warn
