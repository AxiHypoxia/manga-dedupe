plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mangadedupe'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.mangadedupe"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "0.4.0-fastfile"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.all {
            testLogging {
                events "passed", "failed", "skipped"
                exceptionFormat "full"
            }
        }
    }

    packaging {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    // 只用最必要的：RecyclerView（网格）+ DocumentFile（SAF 文件名/大小兜底）
    // 刻意不引 AppCompat / Compose / Coil，减少构建风险；主题用系统 Theme.Material
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'junit:junit:4.13.2'
}
